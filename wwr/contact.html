  <main>
    <div class="contact-info">
      <h1>Adventure Sports</h1>
      <p>4707 Maple Ave</p>
      <p>Bethesda, Maryland</p>
      <p>+1 (703) 819-2121</p>
      <p>info@adventuresports.com</p>
    </div>

    <div class="contact">

    <div class="map">
      <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3101.0143799924676!2d-77.09727812517697!3d38.992168171703966!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x89b7c966e36c5d19%3A0x733981289f0daf78!2s4707%20Maple%20Ave%2C%20Bethesda%2C%20MD%2020814!5e0!3m2!1ses-419!2sus!4v1791023441655!5m2!1ses-419!2sus"; allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>

    <div class="form">
      <form>
        <label for="name">Name: </label>
        <input type="text" id="name" name="name">

        <label for="email">Email: </label>
        <input type="email" id="email" name="email">


        <div class="Message-purpose">
          <p>Message purpuose: </p>
          <div class="purposes">
            <label><input type="radio" id="general" name="purpose" value="general"> General Inquiry</label>
            <label><input type="radio" id="reservation" name="purpose" value="reservation"> Reservation Question</label>
            <label><input type="radio" id="suggestion" name="purpose" value="suggestion"> Website Suggestion</label>
          </div>
        </div>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="4"></textarea>

        <label class="newsletter"><input type="checkbox" name="newsletter" checked> Please Subscribe me to the monthly newsletter
        </label>
 
        <button type="submit">Get in Touch!</button>

      </form>
    </div>

    </div>

    <div class="team">
        <h2>We Are Here to Serve You</h2>
          <figure>
            <img src="images/employee-1.jpg" alt="Employee 1">
