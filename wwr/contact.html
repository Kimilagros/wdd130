<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us | Adventure Sports</title>
  <meta name="description" content="Contact Adventure Sports in Bethesda, Maryland to ask about reservations, trips, or general questions.">
  <meta name="author" content="Kimberly Alejos">
  <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
  <header>
    <img src="images/wwr-logo.png" alt="Adventure Sports logo">
    <div id="logo">Adventure Sports</div>
    <nav>
      <ul class="navigation">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="trips.html">Trips</a></li>
        <li><a href="contact.html">Contact Us</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="contact-info">
      <h1>Contact Us</h1>
      <address>
        <p>4707 Maple Ave</p>
        <p>Bethesda, Maryland</p>
        <p><a href="tel:+17038192121">+1 (703) 819-2121</a></p>
        <p><a href="mailto:info@adventuresports.com">info@adventuresports.com</a></p>
      </address>
    </div>

    <div class="contact-grid">
      <div class="map">
        <iframe title="Map showing Adventure Sports at 4707 Maple Ave, Bethesda, Maryland" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3101.0143799924676!2d-77.09727812517697!3d38.992168171703966!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x89b7c966e36c5d19%3A0x733981289f0daf78!2s4707%20Maple%20Ave%2C%20Bethesda%2C%20MD%2020814!5e0!3m2!1ses-419!2sus!4v1791023441655!5m2!1ses-419!2sus" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
      </div>

      <div class="form">
        <form action="#" method="post">
          <label for="name">Name: </label>
          <input type="text" id="name" name="name" required>

          <label for="email">Email: </label>
          <input type="email" id="email" name="email" required>

          <fieldset class="message-purpose">
            <legend>Message purpose:</legend>
            <div class="purposes">
              <label><input type="radio" id="general" name="purpose" value="general"> General Inquiry</label>
              <label><input type="radio" id="reservation" name="purpose" value="reservation"> Reservation Question</label>
              <label><input type="radio" id="suggestion" name="purpose" value="suggestion"> Website Suggestion</label>
            </div>
          </fieldset>

          <label for="message">Message</label>
          <textarea id="message" name="message" rows="4" required></textarea>

          <label class="newsletter"><input type="checkbox" id="newsletter" name="newsletter"> Please subscribe me to the monthly newsletter</label>

          <button type="submit">Get in Touch!</button>
        </form>
      </div>
    </div>

    <section class="team">
      <h2>We Are Here to Serve You</h2>
      <figure>
        <img src="images/employee-1.jpg" alt="Kimberly Alejos, team member">
        <figcaption>Kimberly Alejos</figcaption>
      </figure>
      <figure>
        <img src="images/employee-2.jpg" alt="Milagros Gutierrez, team member">
        <figcaption>Milagros Gutierrez</figcaption>
      </figure>
      <figure>
        <img src="images/employee-3.jpg" alt="Jordan Alejos, team member">
        <figcaption>Jordan Alejos</figcaption>
      </figure>
    </section>
  </main>

  <footer>
    <p>© 2026 Adventure Sports © Kimberly Alejos</p>
    <nav class="socialmedia">
      <a href="https://facebook.com">
        <img src="images/facebook.svg" alt="Facebook icon">
      </a>
      <a href="https://linkedin.com">
        <img src="images/linkedin.svg" alt="LinkedIn icon">
      </a>
      <a href="https://instagram.com">
        <img src="images/instagram.svg" alt="Instagram icon">
      </a>
    </nav>
  </footer>
</body>
</html>
